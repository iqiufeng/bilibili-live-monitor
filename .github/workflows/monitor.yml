name: Bilibili Live Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 允许 GitHub Actions 将更新后的状态文件 commit 回仓库
permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python bilibili_live_monitor.py

      - name: Commit & Push status file if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f live_status.txt ]; then
            git add live_status.txt
            git diff --staged --quiet || (git commit -m "chore: update live status [skip ci]" && git push)
          fi
