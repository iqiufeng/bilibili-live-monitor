name: Bilibili Live Monitor

on:
  schedule:
    # 采用 UTC 时间。例如：北京时间每 5 分钟跑一次（注意 GitHub 最短支持 5 分钟）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许你在 GitHub 网页上「手动点按钮」测试运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python bilibili_live_monitor.py
